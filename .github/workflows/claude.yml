# The docs agent.
#
# The job of this repo's automation is to keep the user documentation true as the
# product changes. Labrador's "Docs impact" workflow watches every merge, keeps
# only the changes a reader of these pages would actually notice, and files an
# issue here describing it. That issue @-mentions Claude, which reads the
# affected pages, drafts the edit, and opens a pull request.
#
# Nothing reaches docs.testwithlabrador.com without a person merging that pull
# request: Mintlify publishes on push to the default branch, so the pull request
# is the review gate. Keep it that way.
#
# You can also just talk to it: @claude in any issue or pull request comment
# here starts a fresh turn with the surrounding thread as context.
#
# Requires one repository secret:
#   ANTHROPIC_API_KEY
#
# It also needs the Claude GitHub App installed on this repo. Install it by
# running `claude /install-github-app` from a clone of this repo (needs admin).

name: Docs agent

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two gates, and both earn their place.
    #
    # The mention gate keeps this off every unrelated issue and comment.
    #
    # The author gate matters because this repository is public. Without it,
    # any GitHub user could spend the API key and put a pull request in the
    # review queue by leaving a comment. The action does check the triggering
    # user for write access on its own, but this repo's exposure is worth
    # stating here rather than inheriting silently from a dependency.
    #
    # Issues opened by the Labrador pipeline are authored by the owner of
    # DOCS_REPO_TOKEN, so they arrive as OWNER and pass.
    if: >-
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # branch and commit the drafted pages
      pull-requests: write # open the pull request and reply on it
      issues: write # report back on the issue that asked
      id-token: write # short-lived credentials for the action
      actions: read # read CI results on a pull request
    steps:
      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Lets Claude read CI results on a pull request it opened.
          additional_permissions: |
            actions: read
          # House rules live in AGENTS.md at the repo root, which Claude reads
          # on its own. Keep guidance there and not here, so the same rules
          # apply when you run Claude locally against this repo.
          claude_args: |
            --model claude-opus-5
            --max-turns 25
